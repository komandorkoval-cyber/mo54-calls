# This file must be included from nginx's http {} context (on Debian/Ubuntu,
# /etc/nginx/conf.d/*.conf is included there).  It is deliberately separate
# from the MO54 virtual host and declares a zone used only by MO54 Calls.
limit_req_zone $binary_remote_addr zone=mo54_calls_login:10m rate=5r/m;
limit_req_status 429;
