[globals]
RECORDINGS_DIR=/recordings
QUEUE_DIR=/queue
IGOR_EXT=100           ; имя endpoint-а в pjsip.conf
TRUNK=sip-trunk        ; имя endpoint транка (см. pjsip.conf.tpl)
NOVOFON_CALLER_ID=73832359277
RING_TIMEOUT=60        ; секунд вызова до недоступности

; ──────────────────────────────────────────────────────
; ВХОДЯЩИЕ ЗВОНКИ (из Zadarma → Igor)
; ──────────────────────────────────────────────────────
[from-trunk]
exten => _X.,1,NoOp(Incoming: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Set(CALL_DIR=in)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CALLEE_NUM=${EXTEN})
 same => n,Set(STARTED_EPOCH=${EPOCH})
 ; Запись двумя дорожками: rx = клиент, tx = оператор (Игорь)
 ; b = записывать только во время фактического соединения двух каналов
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALL_ID}-mixed.wav,br(${RECORDINGS_DIR}/${CALL_ID}-rx.wav)t(${RECORDINGS_DIR}/${CALL_ID}-tx.wav))
 same => n,Dial(PJSIP/${IGOR_EXT},${RING_TIMEOUT},gH)
 same => n,Hangup()

; h-extension: вызывается после hangup, переменные канала сохранены
exten => h,1,NoOp(Hangup ${CALL_ID} dir=${CALL_DIR} dialstatus=${DIALSTATUS} answered=${ANSWEREDTIME}s)
 same => n,GotoIf($["${CALL_ID}" = ""]?skip)
 same => n,Set(ANSWERED_SECS=${IF($["${ANSWEREDTIME}" = ""]?0:${ANSWEREDTIME})})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER" & ${ANSWERED_SECS} > 1]?enqueue:skip)
 same => n(enqueue),System(/scripts/enqueue-job.sh "${CALL_ID}" "${CALL_DIR}" "${CALLER_NUM}" "${CALLEE_NUM}" "${STARTED_EPOCH}" "${ANSWEREDTIME}" "${RECORDINGS_DIR}/${CALL_ID}-rx.wav" "${RECORDINGS_DIR}/${CALL_ID}-tx.wav" >> /var/log/asterisk/enqueue.log 2>&1)
 same => n,Goto(done)
 same => n(skip),NoOp(Not enqueueing unanswered/zero-duration call ${CALL_ID})
 same => n(done),NoOp(Hangup processing complete)

; ──────────────────────────────────────────────────────
; ИСХОДЯЩИЕ ЗВОНКИ (Igor → Zadarma → клиент)
; ──────────────────────────────────────────────────────
[from-internal]
; Служебный номер Novofon для подтверждения IP-транка: без записи и CRM-задания.
exten => 8888,1,NoOp(Novofon trunk verification)
 same => n,Set(CALLERID(num)=${NOVOFON_CALLER_ID})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},30)
 same => n,Hangup()

; Внутренние номера 100-199 — прямой звонок без транка, с записью
exten => _1XX,1,NoOp(Internal: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Set(CALL_DIR=internal)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CALLEE_NUM=${EXTEN})
 same => n,Set(STARTED_EPOCH=${EPOCH})
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALL_ID}-mixed.wav,br(${RECORDINGS_DIR}/${CALL_ID}-rx.wav)t(${RECORDINGS_DIR}/${CALL_ID}-tx.wav))
 same => n,Dial(PJSIP/${EXTEN},${RING_TIMEOUT},gH)
 same => n,Hangup()

; Внешние номера — через транк Новофон
exten => _[0-9].,1,NoOp(Outgoing: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CALLERID(num)=${NOVOFON_CALLER_ID})
 same => n,Set(CALL_ID=${UNIQUEID})
 same => n,Set(CALL_DIR=out)
 same => n,Set(CALLER_NUM=${CALLERID(num)})
 same => n,Set(CALLEE_NUM=${EXTEN})
 same => n,Set(STARTED_EPOCH=${EPOCH})
 ; rx = то, что слышит Игорь (голос клиента); tx = голос Игоря
 same => n,MixMonitor(${RECORDINGS_DIR}/${CALL_ID}-mixed.wav,br(${RECORDINGS_DIR}/${CALL_ID}-rx.wav)t(${RECORDINGS_DIR}/${CALL_ID}-tx.wav))
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},${RING_TIMEOUT},gH)
 same => n,Hangup()

exten => h,1,NoOp(Hangup ${CALL_ID} dir=${CALL_DIR} dialstatus=${DIALSTATUS} answered=${ANSWEREDTIME}s)
 same => n,GotoIf($["${CALL_ID}" = ""]?skip)
 same => n,Set(ANSWERED_SECS=${IF($["${ANSWEREDTIME}" = ""]?0:${ANSWEREDTIME})})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER" & ${ANSWERED_SECS} > 1]?enqueue:skip)
 same => n(enqueue),System(/scripts/enqueue-job.sh "${CALL_ID}" "${CALL_DIR}" "${CALLER_NUM}" "${CALLEE_NUM}" "${STARTED_EPOCH}" "${ANSWEREDTIME}" "${RECORDINGS_DIR}/${CALL_ID}-rx.wav" "${RECORDINGS_DIR}/${CALL_ID}-tx.wav" >> /var/log/asterisk/enqueue.log 2>&1)
 same => n,Goto(done)
 same => n(skip),NoOp(Not enqueueing unanswered/zero-duration call ${CALL_ID})
 same => n(done),NoOp(Hangup processing complete)
