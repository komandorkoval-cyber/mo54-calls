[general]
dateformat=%F %T
; Ротация каждые 7 дней, хранить 2 файла
rotatestrategy=rotate
exec_after_rotate=gzip -9 ${filename}.2

[logfiles]
console => warning,error
; Только ошибки и предупреждения — не пишем verbose/debug чтобы не раздувать диск
/var/log/asterisk/messages => notice,warning,error
; security лог отключён — SIP-сканеры из интернета заполняют его гигабайтами
; /var/log/asterisk/security => security
/var/log/asterisk/full => notice,warning,error
